  .cardwrap { container-type: inline-size; margin-bottom: 6px; }

  }
  .top { display: flex; justify-content: space-between; align-items: baseline; }
  .brand { color: var(--red); font-weight: 900; font-size: 5.3cqw; letter-spacing: -0.03em; line-height: 1; }
  .org { color: var(--gray); font-size: 3.2cqw; font-weight: 500; letter-spacing: -0.01em; }

  .name { font-size: 9.8cqw; font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
  .title { font-size: 4cqw; font-weight: 500; color: var(--gray); letter-spacing: -0.01em; }

  .rule { height: 1px; background: #E4E4E7; margin: 4.2cqw 0 3.6cqw; }
  .info { list-style: none; display: grid; gap: 1.6cqw; font-size: 3.3cqw; line-height: 1.3; color: #2E2E31; }
  .info li { display: flex; gap: 2.4cqw; min-width: 0; }
  .info b { color: var(--red); font-weight: 700; width: 2.6cqw; flex: none; }
  .info a { color: inherit; text-decoration: none; }

  /* 버튼 */
  .call {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    height: 60px; border-radius: 14px;
    background: var(--red); color: #FFFFFF;
    font-size: 18px; font-weight: 700; letter-spacing: -0.01em;
    text-decoration: none;
    transition: transform .08s ease, background-color .15s ease;
  }
  .call span { font-weight: 500; font-size: 16px; opacity: .92; }
  .call:active { transform: scale(.985); background: var(--red-press); }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn {
    display: flex; align-items: center; gap: 10px;
    height: 54px; padding: 0 16px; border-radius: 12px;
    background: var(--btn); border: 1px solid var(--btn-line); color: var(--btn-ink);
    font-size: 15px; font-weight: 500; letter-spacing: -0.01em;
    text-decoration: none;
    transition: transform .08s ease;
  }
  .btn:active { transform: scale(.985); }
  .btn svg { color: var(--red); flex: none; }
  svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .call svg { width: 22px; height: 22px; }

  .addr { font-size: 12.5px; color: var(--sub); text-align: center; line-height: 1.6; margin-top: 4px; }
  @media (max-width: 340px) {

  }
</style>
