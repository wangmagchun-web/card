<style>
  :root {
    /* 메리츠 CI: Meritz Orange Red RGB 239/59/36, Meritz Gray RGB 109/110/113 */
    --red: #EF3B24;
    --red-deep: #CF2F1B;
    --gray: #6D6E71;
    --bg: #F1F1F3;
    --halo: rgba(239,59,36,.14);
    --btn: #FFFFFF;
    --btn-ink: #1B1B1D;
    --btn-line: #E3E3E6;
    --chip: rgba(239,59,36,.09);
    --sub: #6D6E71;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121214;
      --halo: rgba(239,59,36,.22);
      --btn: #1D1D20;
      --btn-ink: #F2F2F4;
      --btn-line: #2C2C31;
      --chip: rgba(239,59,36,.17);
      --sub: #9C9CA2;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121214;
    --halo: rgba(239,59,36,.22);
    --btn: #1D1D20;
    --btn-ink: #F2F2F4;
    --btn-line: #2C2C31;
    --chip: rgba(239,59,36,.17);
    --sub: #9C9CA2;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; background: var(--bg); }
  body {
    background:
      radial-gradient(110% 340px at 50% -60px, var(--halo), transparent 70%),
      var(--bg);
    color: var(--btn-ink);
    font-family: "Noto Sans KR", "Noto Sans CJK KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    padding: 28px 16px calc(32px + env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    word-break: keep-all;
  }
  main { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 14px; }
  .cardwrap { margin-bottom: 8px; }

  .cardwrap { container-type: inline-size; }
  .card {
    position: relative;
    aspect-ratio: 90 / 52;
    background: linear-gradient(150deg, #FFFFFF 0%, #FFFFFF 46%, #FFF4F1 100%);
    color: #1B1B1D;
    border-radius: 2.4cqw;
    box-shadow:
      0 1px 2px rgba(0,0,0,.06),
      0 14px 34px rgba(0,0,0,.10),
      0 22px 44px -22px rgba(239,59,36,.45);
    overflow: hidden;
    padding: 6.6cqw 7cqw 6.2cqw 9.4cqw;
    display: flex;
    flex-direction: column;
    isolation: isolate;
  }
  /* 왼쪽 빨간 띠: CI 오렌지레드(#EF3B24)에서 아래로 갈수록 깊게. 더 밝은 주황은 안 씀 */
  .card::before {
    content: "";
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 2.2cqw;
    background: linear-gradient(180deg, #EF3B24 0%, #EF3B24 45%, #C42A17 100%);
    z-index: 2;
  }
  /* 오른쪽 아래 동심원 */
  .deco {
    position: absolute; right: -17cqw; bottom: -27cqw;
    width: 64cqw; height: 64cqw;
    z-index: -1; pointer-events: none;
  }
  .deco circle { fill: none; stroke: #EF3B24; }
  /* 오른쪽 위 은은한 붉은 빛 */
  .glow {
    position: absolute; right: -12cqw; top: -18cqw;
    width: 46cqw; height: 46cqw; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(239,59,36,.10), rgba(239,59,36,0));
    z-index: -1; pointer-events: none;
  }

  .top { display: flex; justify-content: space-between; align-items: center; }
  .brand { color: #EF3B24; font-weight: 900; font-size: 5.3cqw; letter-spacing: -0.03em; line-height: 1; }
  .org { color: #6D6E71; font-size: 3.2cqw; font-weight: 500; letter-spacing: -0.01em; display: flex; align-items: center; gap: 1.6cqw; }
  .org .mark { height: 5cqw; width: auto; display: block; flex: none; }
  .org b { color: #1B1B1D; font-weight: 700; }

  .who { margin-top: auto; display: flex; align-items: flex-end; gap: 2.8cqw; }
  .name { font-size: 9.8cqw; font-weight: 700; letter-spacing: -0.02em; line-height: .86; }
  .titles { display: flex; flex-direction: column; gap: 1.1cqw; padding-bottom: .2cqw; }
  .title { font-size: 4cqw; font-weight: 500; color: #6D6E71; letter-spacing: -0.01em; line-height: 1; }
  .en { font-size: 2.35cqw; font-weight: 700; color: #EF3B24; letter-spacing: .2em; text-transform: uppercase; line-height: 1; }

  .rule {
    height: 1px; margin: 4.2cqw 0 3.6cqw;
    background: linear-gradient(90deg, #EF3B24 0%, rgba(239,59,36,.35) 22%, #E4E4E7 48%, #E4E4E7 100%);
  }
  .info { list-style: none; display: grid; gap: 1.6cqw; font-size: 3.3cqw; line-height: 1.3; color: #2E2E31; }
  .info li { display: flex; gap: 2.4cqw; min-width: 0; }
  .info b { color: #EF3B24; font-weight: 700; width: 2.6cqw; flex: none; }
  .info a { color: inherit; text-decoration: none; }
  .info em { font-style: normal; color: #8A8B8E; margin-left: 1.4cqw; }
  /* 연락처가 4줄일 때 간격만 조금 좁힘 */
  .card.dense { padding-top: 5.4cqw; padding-bottom: 5cqw; }
  .card.dense .rule { margin: 3.2cqw 0 2.8cqw; }
  .card.dense .info { gap: 1.2cqw; }

  /* 앞뒷면 뒤집기: 열면 뒷면(사업단 로고)으로 시작해서 앞면으로 넘어옴, 누르면 다시 뒤집힘 */
  .flip { perspective: 1600px; cursor: pointer; }
  .flip-inner {
    position: relative; aspect-ratio: 90 / 52;
    transform-style: preserve-3d; -webkit-transform-style: preserve-3d;
    transition: transform .95s cubic-bezier(.3,.7,.2,1);
  }
  .flip.no-anim .flip-inner { transition: none; }
  .flip.show-back .flip-inner { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; -webkit-backface-visibility: hidden; backface-visibility: hidden; }
  .face > .card { width: 100%; height: 100%; }
  .face.back { transform: rotateY(180deg); }
  .flip.show-back .face.front, .flip:not(.show-back) .face.back { pointer-events: none; }
  .back-card {
    background: radial-gradient(120% 95% at 50% 0%, #343D4B 0%, #29313D 55%, #222833 100%);
    align-items: center; justify-content: center; padding: 0;
    box-shadow:
      0 1px 2px rgba(0,0,0,.08),
      0 14px 34px rgba(0,0,0,.16),
      inset 0 0 0 1px rgba(231,206,170,.16);
  }
  .back-card::before { display: none; }
  .back-card img { height: 64%; width: auto; display: block; }

  /* 카드 위로 빛이 한 번씩 지나가게 */
  .card .shine {
    position: absolute; inset: -20% -60%;
    background: linear-gradient(105deg,
      rgba(239,59,36,0) 44%,
      rgba(239,59,36,.06) 47%,
      rgba(255,255,255,.62) 49.5%,
      rgba(255,255,255,.72) 50%,
      rgba(255,255,255,.62) 50.5%,
      rgba(239,59,36,.06) 53%,
      rgba(239,59,36,0) 56%);
    transform: translateX(-45%);
    animation: shine 7s cubic-bezier(.45,.05,.25,1) 2.3s infinite;
    pointer-events: none; z-index: 3;
  }
  @keyframes shine {
    0%   { transform: translateX(-45%); }
    20%  { transform: translateX(45%); }
    100% { transform: translateX(45%); }
  }

  /* 버튼 */
  .call {
    position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    height: 60px; border-radius: 14px;
    background: linear-gradient(135deg, var(--red) 0%, var(--red) 45%, var(--red-deep) 100%);
    color: #FFFFFF;
    font-size: 18px; font-weight: 700; letter-spacing: -0.01em;
    text-decoration: none;
    box-shadow: 0 10px 22px -10px rgba(239,59,36,.75), inset 0 1px 0 rgba(255,255,255,.25);
    transition: transform .08s ease, filter .15s ease;
  }
  .call span { font-weight: 500; font-size: 16px; opacity: .92; }
  .call2 {
    display: flex; align-items: center; gap: 10px;
    height: 56px; padding: 0 16px 0 10px; border-radius: 12px;
    background: var(--btn); border: 1px solid var(--btn-line); color: var(--btn-ink);
    font-size: 16px; font-weight: 700; letter-spacing: -0.01em;
    text-decoration: none;
    transition: transform .08s ease, border-color .15s ease;
  }
  .call2 .num { margin-left: auto; font-weight: 500; font-size: 15px; color: var(--sub); }
  .call2:active { transform: scale(.985); border-color: rgba(239,59,36,.45); }
  .call:active { transform: scale(.985); filter: brightness(.94); }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn {
    display: flex; align-items: center; gap: 10px;
    height: 56px; padding: 0 14px 0 10px; border-radius: 12px;
    background: var(--btn); border: 1px solid var(--btn-line); color: var(--btn-ink);
    font-size: 15px; font-weight: 500; letter-spacing: -0.01em;
    text-decoration: none;
    transition: transform .08s ease, border-color .15s ease;
  }
  .btn:active { transform: scale(.985); border-color: rgba(239,59,36,.45); }
  .ico {
    width: 34px; height: 34px; border-radius: 10px; flex: none;
    display: grid; place-items: center;
    background: var(--chip); color: var(--red);
  }
  svg.i { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .call svg.i { width: 22px; height: 22px; }

  .addr { font-size: 12.5px; color: var(--sub); text-align: center; line-height: 1.6; margin-top: 4px; }

  /* 처음 열 때 아래에서 살짝 올라오게 */
  .rise { animation: rise .6s cubic-bezier(.2,.7,.2,1) both; }
  .d1 { animation-delay: .08s; } .d2 { animation-delay: .14s; } .d3 { animation-delay: .2s; }
  .d4 { animation-delay: .26s; } .d5 { animation-delay: .32s; } .d6 { animation-delay: .38s; }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) {
    .rise, .card .shine { animation: none; }
    .card .shine { display: none; }
  }
  @media (max-width: 340px) {
    .btn { padding: 0 10px 0 8px; font-size: 14px; gap: 8px; }
    .ico { width: 30px; height: 30px; }
    .call { font-size: 17px; }
    .call span { font-size: 15px; }
  }
</style>

<script>
(function () {
  var f = document.getElementById('flip');
  if (!f) return;
  var front = f.querySelector('.front'), back = f.querySelector('.back');
  function set(showBack) {
    f.classList.toggle('show-back', showBack);
    front.setAttribute('aria-hidden', showBack ? 'true' : 'false');
    back.setAttribute('aria-hidden', showBack ? 'false' : 'true');
  }
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce) {
    f.classList.add('no-anim');
    set(true);
    void f.offsetWidth;
    f.classList.remove('no-anim');
    setTimeout(function () { set(false); }, 1050);
  }
  f.addEventListener('click', function (e) {
    if (e.target.closest && e.target.closest('a')) return;
    set(!f.classList.contains('show-back'));
  });
})();
</script>
